name: codeql

# Shim onto substrate's codeql-scan.yml. This file and its sibling in the
# paired repo were BYTE-IDENTICAL — `diff` returned empty — so the only honest
# thing to keep here is the trigger, which a reusable workflow cannot carry.
#
# The weekly slot stays off-peak (Tuesdays 07:17 UTC) so the scan does not
# fight the daily PR rush for runner capacity.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 7 * * 2'

jobs:
  analyze:
    uses: pleme-io/substrate/.github/workflows/codeql-scan.yml@main
    secrets: inherit
