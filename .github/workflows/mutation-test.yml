name: mutation-test

# Runs mutmut against the critical security/correctness paths once a
# night + on-demand via workflow_dispatch. Mutation testing is much
# heavier than line coverage (each mutated line re-runs the suite),
# so we deliberately:
#   - target ONLY the helper / lookup / inventory / callback / filter /
#     test / action plugins (the 209 generated modules delegate to
#     the helper, so the signal lives on the helper)
#   - allow up to 4h runtime (free-tier limit is 6h)
#   - upload the surviving-mutations report as an artifact AND surface
#     a score in the run summary
#
# A surviving mutation is a code change the test suite did NOT catch
# -- a gap in test depth. Surviving mutations are NOT auto-failures;
# the workflow surfaces them as a quality signal for the maintainer
# to triage. To force a hard fail when survivors exceed a threshold,
# uncomment the score-floor step.

on:
  schedule:
    - cron: '17 4 * * *'  # 04:17 UTC daily (off-peak runner contention)
  workflow_dispatch:
    inputs:
      paths:
        description: 'Optional --paths-to-mutate override (comma list)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  mutate:
    name: mutmut nightly sweep
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 4h ceiling; mutmut is the long pole.

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          # Pinned below 3.13 deliberately: mutmut's cache backend
          # (Pony ORM) cannot decompile Python 3.13 bytecode --
          # `mutmut results`/`mutmut show` crash with "QueryResultIterator
          # object is not iterable". 3.12 doesn't hit this. See the
          # `mutation` extra comment in pyproject.toml for the full story
          # (also why this is pinned to mutmut 2.x, not 3.x).
          python-version: '3.12'

      # This was the last pipe-a-remote-script-into-a-shell in the fleet's
      # workflows: an unpinned third-party installer fetched and executed at job
      # time, which is exactly what the hermetic supply-chain rule exists to
      # stop. setup-uv is what python-gate already uses, so this is the fleet's
      # existing answer rather than a new one.
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies (incl. mutmut extras)
        run: |
          uv sync --frozen --extra mutation

      - name: Confirm test suite is green BEFORE mutating
        run: |
          # Mutation testing is meaningless if the baseline is red --
          # any test failure shows as a false-positive "surviving"
          # mutation. Verify green first.
          .venv/bin/python -m pytest tests/unit tests/sanity -q --no-header

      # The sweep and its report are one tool now. Both behaviours that look
      # like bugs are preserved and explained in the tlisp: mutmut exits
      # non-zero when mutations SURVIVE and that must not fail the job, and the
      # report APPENDS to the shared step summary rather than truncating what
      # earlier steps wrote there.
      # Deliberately NOT `if: always()`. The merged step inherits the SWEEP's
      # gating, not the report's: the step above exists to prove the baseline is
      # green, and mutating against a red baseline reports every real failure as
      # a surviving mutation. The old report carried always() only because it
      # was a separate step that had to survive the sweep's non-zero exit — the
      # tlisp handles that internally now.
      - name: Run mutmut sweep and report
        id: mutmut
        uses: pleme-io/actions/tatara-script@main
        with:
          script-file: tools/mutation-sweep.tlisp
        env:
          PATHS: ${{ inputs.paths }}

      - name: Export full mutmut state as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-state
          path: |
            .mutmut-cache
            html
          retention-days: 14
          if-no-files-found: ignore

      # Uncomment to enforce a survivor ceiling. Pick a number after
      # the first nightly run gives you a baseline.
      #
      # - name: Enforce survivor ceiling
      #   if: always()
      #   run: |
      #     SURVIVORS=$(.venv/bin/mutmut results | grep -c '^survived' || true)
      #     CEILING=50
      #     echo "Surviving mutations: $SURVIVORS (ceiling: $CEILING)"
      #     [ "$SURVIVORS" -le "$CEILING" ]
